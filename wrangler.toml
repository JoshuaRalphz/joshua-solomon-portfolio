# Cloudflare Pages config — keeps build settings in source control
# so any future re-connect or fresh project picks up the right config.
name = "joshua-solomon"
compatibility_date = "2025-05-26"
pages_build_output_dir = "./dist"

# ---- Fit agent (functions/api/fit.js) ----
# Counters for the per-visitor limit and the daily/monthly spend caps.
# Uncomment after `npx wrangler d1 create fit-agent` and paste the id it prints.
# Until then /api/fit answers "not available" (it fails closed without FIT_DB).
# Budgets and limits default in code ($1/day, $30/month, 5 runs per visitor per day);
# override with FIT_DAILY_BUDGET_USD, FIT_MONTHLY_BUDGET_USD, FIT_RUNS_PER_VISITOR.
[[d1_databases]]
binding = "FIT_DB"
database_name = "fit-agent"
database_id = "eb87237c-effd-46ca-b236-5a40aa595991"

# Run Functions near the Anthropic API: Cloudflare HKG serves some PH visitors and Anthropic refuses Hong Kong (403 "Request not allowed").
[placement]
region = "aws:us-east-1"
